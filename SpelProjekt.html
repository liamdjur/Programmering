<body>
<script src="https://koda.nu/simple.js"></script>
    <script>

 // ===== MIN PROJEKTPLAN =====
// Spelidé: Jag ska skapa ett spel som flappy bird där man klickar eller klickar på SPACE för att hoppa och hoppa igenom rören och när man hoppar igenom ett rör så får man ett poäng och så fortsätter det så tills du dör.

// --- SAKER JAG VILL ÖVA PÅ (utifrån tidigare feedback) ---
// (Vad har du fått feedback om tidigare som du vill bli bättre på,
//  eller något du aldrig hann klart med? Skriv in det här och se till
//  att du övar på det i ditt spel under projektet.)
// 1. bättre på att skapa loopar och if satser

// --- MITT KRAV (måste finnas) ---
// Antal spelare: 1
// Antal fiender/hinder: oändligt
// Mål (hur vinner/klarar man spelet?): Samla så många poäng som möjligt genom att hoppa igenom rören.
// Förlustvillkor (hur förlorar man?): Man förlorar om man krockar med ett rör eller slår i marken.

// --- MIN REKOMMENDATION (bör finnas) ---
// 1. hinder
// 2. fågel (spelaren)
// 3. poängräknare
// 4. bakrund

// --- MIN UTMANING (kan finnas, om tid finns) ---
// 1. fixa buggar som uppkommer
// 2. få det se hyvsat bra ut

// --- FÖRBÄTTRINGAR ATT GÖRA SEN ---
// (Lägg till fler idéer här under hela projektet.
//  Känner du dig klar med allt ovan? Kolla den här listan och börja på nästa.)
//


// pssuedo 1: 
// När spelet uppdateras:
// flytta spelaren åt höger med en konstant hastighet
// flytta hinder bakom spelaren så att det kommer nya hinder hela tiden
// OM spelaren krockar så stannar spelet och visar dina poäng
// rita spelaren och hindren på skärmen

// pssuedo 2:
// När spelaren hoppar: 
// OM spelaren trycker på SPACE eller klickar med musen
// Så hoppar spelaren eller åker uppåt 
// OM spelaren inte hoppar och krockar med rören eller marken
// Stanna spelet och visa game over

//Psuedo 3: 
// När spelaren hoppar igenom ett rör:
// OM spelaren hoppar igenom ett rör
// Så ökar poängen med 1



        // skapa en fågel med hjälp av ett objekt där man kan lägga in många egenskaper.
        var Bird = {
            x: 100,
            y: 350,
            width: 50,
            speed: 0,
            gravity: 0.45,
            jumpHeight: -6
        };

        var gameStarted = false; // variabel för att hålla koll på om spelet har startat

        var gameTime = 0; // variabel för att hålla koll på tiden som spelet har spelats
        var gameOver = false;
        var score = 0; 
        var pipes = []; // array för att hålla alla rör
        pipes.push({x: 400, gap: 150,  topHeight: Math.floor(Math.random() * (250 - 50 + 1)) + 50, width: 60, scored: false}); // skapa ett rör som är randomiserat med hjälp av Math.floor och Math.random

    // använd Bird objektet i en funktion som ritar fåglen på skärmen
    function drawBird() {

    // Kropp
    circle(Bird.x, Bird.y, 25, "yellow");

    // Vinge
    circle(Bird.x - 5, Bird.y + 5, 12, "orange");

    // Öga
    circle(Bird.x + 10, Bird.y - 8, 7, "white");
    circle(Bird.x + 12, Bird.y - 8, 3, "black");

    // Näbb
    triangle(Bird.x + 20, Bird.y - 5, Bird.x + 38, Bird.y, Bird.x + 20, Bird.y + 7, "orange");

    }

       function drawPipes() {
        for (var i = 0; i < pipes.length; i++) {
        var pipe = pipes[i];

        if (pipe.x + pipe.width < Bird.x && !pipe.scored) {
         score++;
         pipe.scored = true;
        }

        // Övre röret
        rectangle(pipe.x + 5, 0, pipe.width - 10, pipe.topHeight, "#36b536");
        rectangle(pipe.x, pipe.topHeight - 25, pipe.width, 25, "#228b22");

        // Nedre röret
        var bottomY = pipe.topHeight + pipe.gap;

        rectangle(pipe.x + 5, bottomY, pipe.width - 10, totalHeight - bottomY, "#36b536");
        rectangle(pipe.x, bottomY, pipe.width, 25, "#228b22");

        pipe.x -= 3; // flytta röret åt vänster
    }

    // skapar en loop som ritar rören 
        if (pipes[pipes.length - 1].x < totalWidth - 350) {
        createPipe();
        }

        // glr så att rören utanför skörmen försvinner och inte tar upp minne
        for (var i = pipes.length - 1; i >= 0; i--) {
        if (pipes[i].x < -pipes[i].width) {
        pipes.splice(i, 1);
        }
    }
}
    // skapa rören 
    function createPipe() {
    pipes.push({
        x: totalWidth,
        gap: 150,
        topHeight: Math.floor(Math.random() * (450 - 50 + 1)) + 50,
        width: 60,
        scored: false
        });
    }

    //en funktion som kollar om fåglen har krockat med röret
    function pipeCollision() {
        for (var i = 0; i < pipes.length; i++) {
            var pipe = pipes[i]; 

             if (Bird.x + Bird.width / 2 > pipe.x && Bird.x - Bird.width / 2 < pipe.x + pipe.width) {
                if (Bird.y - Bird.width / 2 < pipe.topHeight || Bird.y + Bird.width / 2 > pipe.topHeight + pipe.gap) {
                 gameOver = true;
                }
            }
        }
    }

        // bakrunden rör sig år vänster med hjälp av x-- vilket minskar ett värde så att de går åt vänster konstant.
    var backgroundX = 0;

        function update() {
            clearScreen();
            // skapa en start där det står "PRESS SPACE / LEFT CLICK TO START!" och när man trycker på space eller vänsterklick så startar spelet.
            if (!gameStarted) {
                picture(0, 0, "https://img.magnific.com/free-vector/pixel-art-city-day-background-with-retro-buildings_107791-35592.jpg?semt=ais_hybrid&w=740&q=80", totalWidth, totalHeight);
                text(100,500, 50, "PRESS SPACE / LEFT CLICK TO START!", "white");
                if (keyboard.space || mouse.left) {
                    gameStarted = true;
                }
                return;
            }

            picture(backgroundX, 0, "https://img.magnific.com/free-vector/pixel-art-city-day-background-with-retro-buildings_107791-35592.jpg?semt=ais_hybrid&w=740&q=80", totalWidth, totalHeight);
            picture(backgroundX + totalWidth, 0, "https://img.magnific.com/free-vector/pixel-art-city-day-background-with-retro-buildings_107791-35592.jpg?semt=ais_hybrid&w=740&q=80", totalWidth, totalHeight);
            backgroundX -= 3; // flytta bakgrunden åt vänster
            if (backgroundX <= -totalWidth) {
            backgroundX = 0;
        }

            // anropa funktionen som ritar rören
            drawPipes();

            // gör så att fåglen faller automatiskt neråt
            Bird.speed += Bird.gravity; 
            Bird.y += Bird.speed;
            drawBird();

            // anropa funktionen som kollar efter krock med rören
            pipeCollision();

            // visa ditt score efter varhe rör du hoppat igenom
            text(20, 40, 30, "Score: " + score, "black");
            text(20,70,30, "Time Played: " + Math.floor(gameTime / 1000) + "s", "black");
            gameTime += 33.33; // öka tiden med 1 varje gång update körs
            gameTime = Math.floor(gameTime); // avrunda tiden till närmaste heltal

            // använd space för att hoppa
            if (keyboard.space) {
                Bird.speed = Bird.jumpHeight;
            }

            // använd musen för att hoppa
            if (mouse.left) {
                Bird.speed = Bird.jumpHeight;
            }

            // gör så att fåglen inte kan gå utanför skärmen
            if (Bird.y < Bird.width / 2 ) {
                Bird.y = Bird.width / 2;
                Bird.y = Bird.speed = 0; 
                gameOver = true;
            }

            // gör så att fåglen inte kan gå utanför skärmen
            if (Bird.y > totalHeight - Bird.width / 2) {
                Bird.y = totalHeight - Bird.width / 2; 
                Bird.y = Bird.speed = 0;
                gameOver = true;
            }

            // om gameOver är true så kommer det game over text och stannar spelet.
            if (gameOver) {
                text(600, 500, 50, "Game Over", "red");
                text(600, 550,20, "Press CTRL + R to restart.", "white");
                stopUpdate();
            }

        }
    </script>
