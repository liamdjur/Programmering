<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="http://koda.nu/simple.js">



        var player  = {
            x: 50,
            y: 50,
            size: 40,
            color: mixColor(random(255), random(255), random(255)),
            speedX: 10,  // rör sig framåt i x-led
            speedY: 25 // hastighet i y-led, kan röra sig diagonalt eller upp eller ner.
        }

        function update() {
            clearScreen();
            circle(player.x, player.y, player.size, player.color);
            circle(player.x + 800, player.y + 200, player.size, player.color);
            player.x = player.x + player.speedX;
            player.y = player.y + player.speedY;
            player.size++;
            player.color = mixColor(random(255), random(255), random(255));


            // Om spelaren går  skärmens bredd, återställ positionen till 0
         if (player.x >= totalWidth) {
            player.x = 0;
        }
        // om player är mer än skärmens höjdåterställ positionen till 0
        if (player.y >= totalHeight) {
            player.y = 0;
        }

        // om storlekem är 150 eller mer, återställ storleken till 40
        if (player.size >= 150) {
            player.size = 40;
        }



    }
</script>
</body>
</html>
