<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script src="http://koda.nu/simple.js">


        var player = {
            x: 50,
            y: 50, 
            size: 40, 
            color: "red",
            speedX: 3,
            speedY: 2, 
            direction: 1,
            directionY: 1
        };


        function update() {
            clearScreen();
            // circle(player.x, player.y, player.size, player.color);
            rectangle(player.x, player.y, 150, 100, player.color);
            picture(player.x, player.y, "https://shorturl.at/tQfCC", 150, 100);
            player.x = player.x + player.speedX * player.direction;
            player.y = player.y + player.speedY * player.directionY;

            if (player.x + 150 > totalWidth) {
                player.direction = -1;
                player.color = mixColor(random(255), random(255), random(255));
                console.log("hit right")
            }

            if (player.x < 0) {
                player.direction = 1;
                player.color = mixColor(random(255), random(255), random(255));
                console.log("hit left")
            }

            if (player.y < 0) {
                player.directionY = 1;
                player.color = mixColor(random(255), random(255), random(255));
                console.log("hit top")
            }

            if (player.y + 100 > totalHeight) {
                player.directionY = -1;
                player.color = mixColor(random(255), random(255), random(255));
                console.log("hit bottom")
            }
        }
    </script>
</body>
</html>
